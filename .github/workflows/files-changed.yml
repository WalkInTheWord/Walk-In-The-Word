name: Generate Changed Files JSON

on:
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  generate-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch base commit and origin/master
        # Fetch what to compare the commit against
        run: |
          git fetch --no-tags --prune --depth=1 origin ${{ github.event.pull_request.base.sha }}
          git fetch --no-tags --prune --depth=1 origin main

      - name: Write changed files to a JSON file
        run: |
          git diff --name-only --full-index "${{ github.event.pull_request.base.sha }}" |
            jq --raw-input --slurp 'split("\n") | map(select(length > 0))' > changed_files.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: changed-files
          path: changed_files.json
